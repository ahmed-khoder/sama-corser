# ═══════════════════════════════════════════
# SAMA Logistics — Docker Compose
# ═══════════════════════════════════════════

services:
  sama-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sama-logistics
    restart: unless-stopped
    ports:
      # Expose on 0.0.0.0 (all interfaces including external/public IP)
      - "0.0.0.0:${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/data/db/dev.db
      - JWT_SECRET=${JWT_SECRET:-sama-logistics-production-secret-change-me}
      - NEXT_PUBLIC_BASE_URL=${NEXT_PUBLIC_BASE_URL:-http://localhost:3000}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-https://samalogistics.com}
    volumes:
      # Persistent data volumes (safe against restarts and image updates)
      - sama-db:/data/db
      - sama-images:/data/images
      - sama-uploads:/data/uploads
    networks:
      - sama-network

volumes:
  sama-db:
  sama-images:
  sama-uploads:

networks:
  sama-network:
    driver: bridge
